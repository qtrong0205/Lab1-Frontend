<div class="relative w-full overflow-hidden">
<div class="flex flex-col items-center justify-center text-center mb-6">
<div class="w-14 h-14 p-1.5 rounded-2xl bg-surface-container-low flex items-center justify-center shadow-sm mb-4">
<img alt="Logo Việc học của tôi" class="w-10 h-10 object-contain rounded-md" src="https://lh3.googleusercontent.com/aida/AEtjO1UXRwyBXM-2cM-t7tJrzlxcO1THzMtnQeqGrqWjd47oRxzhdB2-j6nIIVjJxhp0IkNpeRstnVL7FSGV1Wepifywk2je2XZv61UZVelVgLYmhd10iq_jkO9p8PwToN-Uko2nqL30aejcBczHQMABe1fRozKUpSgNpGSc4eI0-MOTz41jFof6p1Lz-SH5Bf1TiHUPSeX_9K7ZRFNiovojIPrcn_4eLejQlv-ch1Bof_zV9pL4B1VQZAwRJePg"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Đăng nhập</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Chào mừng bạn quay lại với Việc học của tôi</p>
</div>
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="space-y-1.5">
<label class="block font-label-lg text-label-lg text-on-surface" for="email">Địa chỉ Email</label>
<div class="relative rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#2563eb]">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full bg-transparent pl-10 pr-3.5 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-lg" id="email" name="email" placeholder="nhapemail@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">Mật khẩu</label>
</div>
<div class="relative rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#2563eb]">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full bg-transparent pl-10 pr-11 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none rounded-lg" id="password" name="password" placeholder="Nhập mật khẩu của bạn" required="" type="password"/>
<button aria-label="Hiển thị hoặc ẩn mật khẩu" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface focus:outline-none transition-colors" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center space-x-2.5 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-primary-container bg-surface-container-low focus:ring-0 cursor-pointer accent-[#2563eb]" id="rememberMe" name="remember" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-lg text-label-lg text-primary-container hover:text-primary transition-colors duration-150" href="#forgot-password">
          Quên mật khẩu?
        </a>
</div>
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-primary-container hover:bg-[#1d4ed8] active:bg-[#1e40af] text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:shadow-md transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2" id="submitBtn" type="submit">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-6 pt-5 bg-surface-container-lowest text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Chưa có tài khoản? 
        <a class="font-label-lg text-label-lg text-primary-container hover:text-primary font-semibold ml-1 inline-flex items-center transition-colors" href="#register">
          Đăng ký ngay
        </a>
</p>
</div>
</div>
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 bg-inverse-surface text-inverse-on-surface rounded-lg font-body-sm text-body-sm shadow-xl opacity-0 pointer-events-none transition-opacity duration-300" id="statusToast">
    Đang xử lý đăng nhập...
  </div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const toast = document.getElementById('statusToast');
    const submitBtn = document.getElementById('submitBtn');

    if (!email || !password) return;

    if (submitBtn) {
      submitBtn.classList.add('opacity-80', 'pointer-events-none');
      submitBtn.querySelector('span:first-child').textContent = 'Đang đăng nhập...';
    }

    if (toast) {
      toast.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
        if (submitBtn) {
          submitBtn.classList.remove('opacity-80', 'pointer-events-none');
          submitBtn.querySelector('span:first-child').textContent = 'Đăng nhập';
        }
      }, 2500);
    }
  }
</script></main></body></html>
